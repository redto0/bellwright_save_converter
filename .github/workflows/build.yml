name: Build Windows app

# Pushes to main and testing build and smoke-test the exe; the result is kept
# as a workflow artifact only. Pushing a tag like v1.0.2 publishes it as the
# one and only release, which is what the README's download link points at.
on:
  push:
    branches: [main, testing]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Check the source
        shell: bash
        run: |
          python -W error::SyntaxWarning -m compileall -q bellwright bellwright_save_converter.py
          python bellwright_save_converter.py --help > /dev/null

      - name: Install PyInstaller
        run: python -m pip install "pyinstaller>=6.10,<7"

      - name: Build
        run: >
          pyinstaller --onefile --windowed --clean --noconfirm
          --name BellwrightSaveConverter
          --hidden-import bellwright.gui
          bellwright_save_converter.py

      - name: Smoke test
        shell: pwsh
        run: |
          # A windowed exe has no console to read, so check that it starts,
          # imports everything it bundles, and exits cleanly on --help.
          $p = Start-Process dist\BellwrightSaveConverter.exe -ArgumentList '--help' -PassThru
          $null = $p.Handle  # keeps ExitCode readable after the process ends
          if (-not $p.WaitForExit(120000)) { $p.Kill(); throw 'exe did not exit within 2 minutes' }
          if ($p.ExitCode -ne 0) { throw "exe exited with code $($p.ExitCode)" }
          $size = (Get-Item dist\BellwrightSaveConverter.exe).Length / 1MB
          "BellwrightSaveConverter.exe OK, {0:N1} MB" -f $size

      - uses: actions/upload-artifact@v4
        with:
          name: BellwrightSaveConverter
          path: dist/BellwrightSaveConverter.exe

  release:
    # Keeps exactly one release. A v* tag publishes the new version; every run
    # on main or a tag then removes any other release, so the page never
    # accumulates old versions.
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    # A tag and main pushed together must not prune at the same time.
    concurrency:
      group: releases
      cancel-in-progress: false
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/download-artifact@v4
        if: github.ref_type == 'tag'
        with:
          name: BellwrightSaveConverter

      - name: Publish the release
        if: github.ref_type == 'tag'
        run: |
          previous=$(gh api "repos/$GH_REPO/releases/latest" --jq .tag_name 2>/dev/null || true)
          gh release create "$GITHUB_REF_NAME" BellwrightSaveConverter.exe \
            --title "$GITHUB_REF_NAME" \
            --latest \
            --generate-notes \
            ${previous:+--notes-start-tag "$previous"}

      - name: Remove every other release
        run: |
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            keep="$GITHUB_REF_NAME"
          else
            keep=$(gh api "repos/$GH_REPO/releases/latest" --jq .tag_name 2>/dev/null || true)
          fi
          keep=${keep%$'\r'}
          # Never prune without knowing which release to keep.
          if [ -z "$keep" ]; then
            echo "No latest release found; nothing removed."
            exit 0
          fi
          gh api "repos/$GH_REPO/releases?per_page=100" --jq '.[].tag_name' |
          while read -r tag; do
            tag=${tag%$'\r'}  # a stray CR must never make the kept release look different
            [ "$tag" = "$keep" ] && continue
            echo "Removing release $tag (keeping $keep)"
            case "$tag" in
              v*) gh release delete "$tag" --yes ;;  # the version tag stays in git
              *)  gh release delete "$tag" --yes --cleanup-tag ;;
            esac
          done
