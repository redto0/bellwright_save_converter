name: Build Windows app

# Release channels:
#   testing  every push to the testing branch replaces the "testing-build"
#            pre-release, for trying changes before they reach main
#   rolling  every push to main replaces the "rolling" pre-release
#   stable   pushing a tag like v1.0.0 publishes a release marked Latest, which
#            is what the README's download link points at
on:
  push:
    branches: [main, testing]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Check the source
        shell: bash
        run: |
          python -W error::SyntaxWarning -m compileall -q bellwright bellwright_save_converter.py
          python bellwright_save_converter.py --help > /dev/null

      - name: Install PyInstaller
        run: python -m pip install "pyinstaller>=6.10,<7"

      - name: Build
        run: >
          pyinstaller --onefile --windowed --clean --noconfirm
          --name BellwrightSaveConverter
          --hidden-import bellwright.gui
          bellwright_save_converter.py

      - name: Smoke test
        shell: pwsh
        run: |
          # A windowed exe has no console to read, so check that it starts,
          # imports everything it bundles, and exits cleanly on --help.
          $p = Start-Process dist\BellwrightSaveConverter.exe -ArgumentList '--help' -PassThru
          $null = $p.Handle  # keeps ExitCode readable after the process ends
          if (-not $p.WaitForExit(120000)) { $p.Kill(); throw 'exe did not exit within 2 minutes' }
          if ($p.ExitCode -ne 0) { throw "exe exited with code $($p.ExitCode)" }
          $size = (Get-Item dist\BellwrightSaveConverter.exe).Length / 1MB
          "BellwrightSaveConverter.exe OK, {0:N1} MB" -f $size

      - uses: actions/upload-artifact@v4
        with:
          name: BellwrightSaveConverter
          path: dist/BellwrightSaveConverter.exe

  prerelease:
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/testing'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    # Two quick pushes to one branch must not interleave the delete and the
    # re-create.
    concurrency:
      group: prerelease-${{ github.ref_name }}
      cancel-in-progress: false
    env:
      # The testing tag is not called "testing" so it never shares a name with
      # the branch, which would make git refs ambiguous.
      TAG: ${{ github.ref_name == 'main' && 'rolling' || 'testing-build' }}
      TITLE: ${{ github.ref_name == 'main' && 'Rolling build' || 'Testing build' }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: BellwrightSaveConverter

      - name: Replace the pre-release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release delete "$TAG" --cleanup-tag --yes || true
          # Also drop the tag if a previous run left it without a release, so
          # the new release is tagged at this commit rather than the old one.
          gh api -X DELETE "repos/$GH_REPO/git/refs/tags/$TAG" || true
          gh release create "$TAG" BellwrightSaveConverter.exe \
            --target "$GITHUB_SHA" \
            --prerelease \
            --title "$TITLE" \
            --notes "Newest build of $GITHUB_REF_NAME (${GITHUB_SHA::7}), replaced on every push. For the stable version, use the release marked Latest."

  stable:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: BellwrightSaveConverter

      - name: Publish stable release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          # Generate notes against the previous stable release, not the
          # rolling pre-release.
          previous=$(gh api "repos/$GH_REPO/releases" \
            --jq '[.[] | select(.prerelease | not) | .tag_name][0] // empty')
          gh release create "$GITHUB_REF_NAME" BellwrightSaveConverter.exe \
            --title "$GITHUB_REF_NAME" \
            --latest \
            --generate-notes \
            ${previous:+--notes-start-tag "$previous"}
